repo_uri: git@github.com:xtreme-nitin-ravindran/tps-dispatch-dashboard.git
# Use a dedicated deploy key with WRITE access to the repository.
# Copy this file to values.yml and replace this placeholder locally.
# Never commit the populated values.yml or an actual private key.
repo_private_key: |
  REPLACE_WITH_PRIVATE_SSH_KEY

# Pull credentials for the private zot registry image the update-and-publish task
# runs on (zot.home.arpa/homelab/task-base).
signalto_registry_pull_user: REPLACE_WITH_REGISTRY_PULL_USER
signalto_registry_pull_password: REPLACE_WITH_REGISTRY_PULL_PASSWORD

# Vault AppRole credentials for the task's in-task login. The task uses them to
# fetch the secret-class R2 keys from secret/data/sirento/main itself, so the R2
# keys are deliberately NOT credential-manager vars.
sirento_role_id: REPLACE_WITH_SIRENTO_ROLE_ID
sirento_secret_id: REPLACE_WITH_SIRENTO_SECRET_ID

# Cloudflare R2 publication target (non-secret). The pipeline publishes
# data/current.json (the incident snapshot) to this bucket over the S3 API
# (SigV4). TTC geometry (data/ttc-diversions.json) is owned by the continuous
# capture stack, not this pipeline (Story 79 single-writer ownership). Supply
# these through the Concourse credential manager (or a local values file) and
# never commit real credentials.
r2_endpoint: https://<account-id>.r2.cloudflarestorage.com
r2_bucket: sirento
