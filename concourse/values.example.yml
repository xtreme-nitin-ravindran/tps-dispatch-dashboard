repo_uri: git@github.com:xtreme-nitin-ravindran/tps-dispatch-dashboard.git
# Use a dedicated deploy key with WRITE access to the repository.
# Copy this file to values.yml and replace this placeholder locally.
# Never commit the populated values.yml or an actual private key.
repo_private_key: |
  REPLACE_WITH_PRIVATE_SSH_KEY

# Cloudflare R2 publication target. The pipeline publishes data/current.json (the
# incident snapshot) to this bucket over the S3 API (SigV4). TTC geometry
# (data/ttc-diversions.json) is owned by the continuous capture stack, not this
# pipeline (Story 79 single-writer ownership). Supply these through the Concourse
# credential manager (or a local values file) and never commit real credentials.
r2_endpoint: https://<account-id>.r2.cloudflarestorage.com
r2_bucket: sirento
r2_access_key_id: REPLACE_WITH_R2_ACCESS_KEY_ID
r2_secret_access_key: REPLACE_WITH_R2_SECRET_ACCESS_KEY
