resources:
  - name: refresh
    type: time
    source:
      # The single update-sirento job runs the incident ETL plus a 90-second TTC
      # vehicle burst and typically takes 2-4 minutes. A 5-minute interval keeps
      # the timer above the worst-case job duration so builds do not queue.
      interval: 5m
  - name: repo
    type: git
    source:
      uri: ((repo_uri))
      branch: main
      private_key: ((repo_private_key))

  - name: snapshots
    type: git
    source:
      uri: ((repo_uri))
      branch: data
      private_key: ((repo_private_key))

jobs:
  # Single writer for the `data` branch. Incident ETL and the bounded TTC vehicle
  # burst run as sequential steps in one job so there is exactly one `put` and no
  # two writers can race a fast-forward push. The trade-off is deliberate: a TTC
  # failure fails the whole build, so the next timer tick retries both.
  - name: update-sirento
    # One writer, one build at a time. max_in_flight serializes this job's own
    # builds so a slow run cannot overlap the next timer tick and race the push.
    max_in_flight: 1
    build_log_retention:
      builds: 50
    plan:
      - get: refresh
        trigger: true
      - get: snapshots
      - get: repo
      - task: test-update-and-commit
        timeout: 10m
        config:
          platform: linux
          image_resource:
            type: registry-image
            source:
              repository: node
              # Full image includes Git; slim does not.
              tag: 22-bookworm
          inputs:
            - name: repo
            - name: snapshots
          outputs:
            - name: incident-repo
          params:
            NPM_VERSION: 12.1.0
          run:
            path: sh
            args:
              - -ec
              - |
                if [ "$(npm --version 2>/dev/null || true)" != "$NPM_VERSION" ]; then
                  npm install -g "npm@$NPM_VERSION"
                fi
                cp -a snapshots/. incident-repo/
                cd repo
                npm ci
                TZ=UTC npm test
                TZ=America/Los_Angeles npm test
                TFS_UPDATED_BY=concourse TFS_PREVIOUS=../snapshots/data/current.json TFS_OUTPUT=../incident-repo/data/current.json node scripts/tfs-etl.js
                cd ../incident-repo
                node ../repo/scripts/commit-tfs.js
      # Bounded 90-second vehicle burst; never runs the heavy incident ETL.
      - task: observe-vehicles
        timeout: 6m
        file: repo/concourse/ttc-vehicles.yml
      # Project confirmed TTC geometry into the same working copy as the incident
      # snapshot so a single `put` publishes both files.
      - task: publish-ttc-geometry
        config:
          platform: linux
          image_resource:
            type: registry-image
            source: { repository: node, tag: 22-bookworm }
          inputs:
            - name: repo
            - name: incident-repo
            - name: ttc-vehicle-evidence
          outputs:
            - name: updated-repo
          run:
            path: sh
            args:
              - -ec
              - |
                # An output with the same name as an input replaces it, so seed the
                # output from the incident snapshot before adding TTC geometry.
                cp -a incident-repo/. updated-repo/
                cd repo
                npm ci --omit=dev
                node scripts/publish-ttc-geometry.js ../ttc-vehicle-evidence/diversions.json ../updated-repo/data/ttc-diversions.json
                cd ../updated-repo
                git add -- data/ttc-diversions.json
                if ! git diff --cached --quiet; then
                  git -c user.name='SirenTO updater' -c user.email='sirento-updater@localhost' commit -m 'chore: refresh public TTC geometry'
                fi
      # Single fast-forward push for both data/current.json and data/ttc-diversions.json.
      - put: snapshots
        timeout: 2m
        params:
          repository: updated-repo
