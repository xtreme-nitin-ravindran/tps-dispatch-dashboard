resources:
  - name: refresh
    type: time
    source:
      interval: 1m
  - name: repo
    type: git
    source:
      uri: ((repo_uri))
      branch: ((repo_branch))
      private_key: ((repo_private_key))

jobs:
  - name: update-tfs
    serial: true
    build_log_retention:
      builds: 50
    plan:
      - get: refresh
        trigger: true
      - get: repo
      - task: test-update-and-commit
        timeout: 10m
        config:
          platform: linux
          image_resource:
            type: registry-image
            source:
              repository: node
              # Full image includes Git; slim does not.
              tag: 22-bookworm
          inputs:
            - name: repo
          outputs:
            - name: updated-repo
          run:
            path: sh
            args:
              - -ec
              - |
                cp -a repo/. updated-repo/
                cd updated-repo
                TZ=UTC npm test
                TZ=America/Los_Angeles npm test
                TFS_UPDATED_BY=concourse TFS_PREVIOUS=data/current.json TFS_OUTPUT=data/current.json node scripts/tfs-etl.js
                node scripts/commit-tfs.js
      # Fast-forward only: a concurrent push fails safely instead of overwriting
      # newer history or publishing results based on untested code after a rebase.
      # Rerun with fresh inputs or wait for the next timer tick to recompute.
      - put: repo
        timeout: 2m
        params:
          repository: updated-repo
