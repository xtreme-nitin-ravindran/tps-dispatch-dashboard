resources:
  - name: refresh
    type: time
    source:
      interval: 1m
  - name: repo
    type: git
    source:
      uri: ((repo_uri))
      branch: main
      private_key: ((repo_private_key))

  - name: snapshots
    type: git
    source:
      uri: ((repo_uri))
      branch: data
      private_key: ((repo_private_key))

jobs:
  - name: update-sirento
    serial: true
    build_log_retention:
      builds: 50
    plan:
      - get: refresh
        trigger: true
      - get: snapshots
      - get: repo
      - task: test-update-and-commit
        timeout: 10m
        config:
          platform: linux
          image_resource:
            type: registry-image
            source:
              repository: node
              # Full image includes Git; slim does not.
              tag: 22-bookworm
          inputs:
            - name: repo
            - name: snapshots
          outputs:
            - name: updated-repo
          params:
            NPM_VERSION: 12.1.0
          run:
            path: sh
            args:
              - -ec
              - |
                if [ "$(npm --version 2>/dev/null || true)" != "$NPM_VERSION" ]; then
                  npm install -g "npm@$NPM_VERSION"
                fi
                cp -a snapshots/. updated-repo/
                cd repo
                TZ=UTC npm test
                TZ=America/Los_Angeles npm test
                TFS_UPDATED_BY=concourse TFS_PREVIOUS=../snapshots/data/current.json TFS_OUTPUT=../updated-repo/data/current.json node scripts/tfs-etl.js
                cd ../updated-repo
                node ../repo/scripts/commit-tfs.js
      # Fast-forward only: a concurrent push fails safely instead of overwriting
      # newer history or publishing results based on untested code after a rebase.
      # Rerun with fresh inputs or wait for the next timer tick to recompute.
      - put: snapshots
        timeout: 2m
        params:
          repository: updated-repo
