resources:
  - name: refresh
    type: time
    source:
      interval: 3m
  - name: repo
    type: git
    source:
      uri: ((repo_uri))
      branch: main
      private_key: ((repo_private_key))

  - name: snapshots
    type: git
    source:
      uri: ((repo_uri))
      branch: data
      private_key: ((repo_private_key))

jobs:
  - name: update-sirento
    build_log_retention:
      builds: 50
    plan:
      - get: refresh
        trigger: true
      - get: snapshots
      - get: repo
      - task: test-update-and-commit
        timeout: 10m
        config:
          platform: linux
          image_resource:
            type: registry-image
            source:
              repository: node
              # Full image includes Git; slim does not.
              tag: 22-bookworm
          inputs:
            - name: repo
            - name: snapshots
          outputs:
            - name: updated-repo
          params:
            NPM_VERSION: 12.1.0
          run:
            path: sh
            args:
              - -ec
              - |
                if [ "$(npm --version 2>/dev/null || true)" != "$NPM_VERSION" ]; then
                  npm install -g "npm@$NPM_VERSION"
                fi
                cp -a snapshots/. updated-repo/
                cd repo
                npm ci
                TZ=UTC npm test
                TZ=America/Los_Angeles npm test
                TFS_UPDATED_BY=concourse TFS_PREVIOUS=../snapshots/data/current.json TFS_OUTPUT=../updated-repo/data/current.json node scripts/tfs-etl.js
                cd ../updated-repo
                node ../repo/scripts/commit-tfs.js
  - name: detect-ttc-vehicle-deviations
    build_log_retention:
      builds: 50
    plan:
      - get: repo
      - task: observe-vehicles
        timeout: 6m
        file: repo/concourse/ttc-vehicles.yml
      - get: snapshots
        passed: [update-sirento]
        trigger: true
      - task: publish-ttc-geometry
        config:
          platform: linux
          image_resource:
            type: registry-image
            source: { repository: node, tag: 22-bookworm }
          inputs:
            - name: repo
            - name: snapshots
            - name: ttc-vehicle-evidence
          outputs:
            - name: ttc-updated-repo
          run:
            path: sh
            args:
              - -ec
              - |
                cp -a snapshots/. ttc-updated-repo/
                cd repo
                npm ci --omit=dev
                node scripts/publish-ttc-geometry.js ../ttc-vehicle-evidence/diversions.json ../ttc-updated-repo/data/ttc-diversions.json
                cd ../ttc-updated-repo
                git add -- data/ttc-diversions.json
                if ! git diff --cached --quiet; then
                  git -c user.name='SirenTO updater' -c user.email='sirento-updater@localhost' commit -m 'chore: refresh public TTC geometry'
                fi
      - put: snapshots
        no_get: true
        params:
          repository: ttc-updated-repo
