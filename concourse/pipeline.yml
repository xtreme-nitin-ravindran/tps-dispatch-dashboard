resources:
  - name: refresh
    type: time
    source:
      # The single update-sirento job runs the incident ETL plus a 90-second TTC
      # vehicle burst and typically takes 2-4 minutes. A 5-minute interval keeps
      # the timer above the worst-case job duration so builds do not queue.
      interval: 5m
  - name: repo
    type: git
    source:
      uri: ((repo_uri))
      branch: main
      private_key: ((repo_private_key))

jobs:
  # Single writer for the published data. The incident snapshot is published to
  # R2 first, then the bounded TTC vehicle burst and geometry projection run as
  # later steps. A TTC failure cannot block or roll back the already-published
  # incident snapshot; the next timer tick retries the TTC stage. Each phase
  # writes a different R2 key, so the two datasets cannot conflict and no lock
  # or serial group is needed.
  - name: update-sirento
    # One writer, one build at a time. max_in_flight serializes this job's own
    # builds so a slow run cannot overlap the next timer tick.
    max_in_flight: 1
    build_log_retention:
      builds: 50
    plan:
      - get: refresh
        trigger: true
      - get: repo
      # Build the same pinned test image used by GitHub Actions. UNPACK_ROOTFS
      # exposes it as a task image for the following verification/update step.
      - task: build-test-image
        timeout: 5m
        privileged: true
        output_mapping:
          image: test-image
        config:
          platform: linux
          image_resource:
            type: registry-image
            source: { repository: concourse/oci-build-task }
          inputs:
            - name: repo
          outputs:
            - name: image
          caches:
            - path: cache
          params:
            CONTEXT: repo
            DOCKERFILE: repo/Dockerfile.test
            UNPACK_ROOTFS: "true"
          run:
            path: build
      - task: test-update-and-publish
        timeout: 10m
        image: test-image
        config:
          platform: linux
          inputs:
            - name: repo
          outputs:
            - name: incident-repo
          params:
            R2_ENDPOINT: ((r2_endpoint))
            R2_BUCKET: ((r2_bucket))
            R2_ACCESS_KEY_ID: ((r2_access_key_id))
            R2_SECRET_ACCESS_KEY: ((r2_secret_access_key))
          run:
            path: sh
            args:
              - -ec
              - |
                # Match the GitHub Actions test gate using the same image and
                # canonical offline-suite selector.
                cd /workspace
                TZ=America/Los_Angeles npm test
                npm run test:python
                npm run lint
                node --check app.js
                find src scripts -name "*.js" -exec node --check {} \;
                TZ=UTC NODE_V8_COVERAGE=/tmp/coverage npm run test:coverage

                # Seed the ETL history input from the published snapshot. A
                # missing object is not an error: the ETL starts fresh, exactly
                # as it did when the git checkout was empty.
                node /workspace/scripts/r2-fetch.js data/current.json /tmp/history/current.json

                # Shared freshness/skip policy and R2 publication. The R2 sink
                # uploads directly, so there is no scheduler push step. The
                # snapshot is also written to the incident-repo output so the
                # following vehicle task can reuse it as advisory context.
                TFS_UPDATED_BY=concourse \
                  TFS_PREVIOUS=/tmp/history/current.json \
                  TFS_OUTPUT="$PWD/incident-repo/data/current.json" \
                  node /workspace/scripts/publish-incidents.js
      # Bounded 90-second vehicle burst; never runs the heavy incident ETL.
      - task: observe-vehicles
        timeout: 6m
        file: repo/concourse/ttc-vehicles.yml
      # Project confirmed TTC geometry and publish it to R2. The R2 sink uploads
      # directly, so there is no scheduler push step.
      - task: publish-ttc-geometry
        config:
          platform: linux
          image_resource:
            type: registry-image
            source: { repository: node, tag: 24-bookworm }
          inputs:
            - name: repo
            - name: ttc-vehicle-evidence
          params:
            R2_ENDPOINT: ((r2_endpoint))
            R2_BUCKET: ((r2_bucket))
            R2_ACCESS_KEY_ID: ((r2_access_key_id))
            R2_SECRET_ACCESS_KEY: ((r2_secret_access_key))
          run:
            path: sh
            args:
              - -ec
              - |
                cd repo
                npm ci --omit=dev
                TTC_DIVERSION_OUTPUT=../ttc-vehicle-evidence/diversions.json \
                  node scripts/publish-ttc-phase.js
