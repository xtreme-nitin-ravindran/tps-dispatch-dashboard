resources:
  - name: refresh
    type: time
    source:
      # The single update-sirento job runs the incident ETL plus a 4.5-minute TTC
      # vehicle burst. Five-minute ticks minimize sampling gaps; max_in_flight
      # prevents overlapping publications if a run exceeds the timer interval.
      interval: 5m
  - name: repo
    type: git
    source:
      uri: ((repo_uri))
      branch: main
      private_key: ((repo_private_key))

jobs:
  # Single writer for the published data. The incident snapshot is published to
  # R2 first, then the bounded TTC vehicle burst and geometry projection run as
  # later steps. A TTC failure cannot block or roll back the already-published
  # incident snapshot; the next timer tick retries the TTC stage. Each phase
  # writes a different R2 key, so the two datasets cannot conflict and no lock
  # or serial group is needed.
  - name: update-sirento
    # One writer, one build at a time. max_in_flight serializes this job's own
    # builds so a slow run cannot overlap the next timer tick.
    max_in_flight: 1
    build_log_retention:
      builds: 50
    plan:
      - get: refresh
        trigger: true
      - get: repo
      # main has already passed the protected promotion gate; this task only
      # installs runtime dependencies, updates the snapshot, and publishes it.
      - task: update-and-publish
        timeout: 10m
        config:
          platform: linux
          image_resource:
            type: registry-image
            source: { repository: node, tag: 24-bookworm-slim }
          inputs:
            - name: repo
          outputs:
            - name: incident-repo
          params:
            R2_ENDPOINT: ((r2_endpoint))
            R2_BUCKET: ((r2_bucket))
            R2_ACCESS_KEY_ID: ((r2_access_key_id))
            R2_SECRET_ACCESS_KEY: ((r2_secret_access_key))
          run:
            path: sh
            args:
              - -ec
              - |
                # Capture the declared Concourse output before changing directory.
                INCIDENT_OUTPUT="$PWD/incident-repo/data/current.json"
                cd repo
                npm ci --omit=dev

                # Seed the ETL history input from the published snapshot. A
                # missing object is not an error: the ETL starts fresh, exactly
                # as it did when the git checkout was empty.
                node scripts/r2-fetch.js data/current.json /tmp/history/current.json

                # Shared freshness/skip policy and R2 publication. The R2 sink
                # uploads directly, so there is no scheduler push step. The
                # snapshot is also written to the incident-repo output so the
                # following vehicle task can reuse it as advisory context.
                TFS_UPDATED_BY=concourse \
                  TFS_PREVIOUS=/tmp/history/current.json \
                  TFS_OUTPUT="$INCIDENT_OUTPUT" \
                  node scripts/publish-incidents.js
      # Bounded 4.5-minute vehicle burst; never runs the heavy incident ETL.
      - task: observe-vehicles
        timeout: 6m
        file: repo/concourse/ttc-vehicles.yml
      # Project confirmed TTC geometry and publish it to R2. The R2 sink uploads
      # directly, so there is no scheduler push step.
      - task: publish-ttc-geometry
        config:
          platform: linux
          image_resource:
            type: registry-image
            source: { repository: node, tag: 24-bookworm }
          inputs:
            - name: repo
            - name: ttc-vehicle-evidence
          params:
            R2_ENDPOINT: ((r2_endpoint))
            R2_BUCKET: ((r2_bucket))
            R2_ACCESS_KEY_ID: ((r2_access_key_id))
            R2_SECRET_ACCESS_KEY: ((r2_secret_access_key))
          run:
            path: sh
            args:
              - -ec
              - |
                cd repo
                npm ci --omit=dev
                TTC_DIVERSION_OUTPUT=../ttc-vehicle-evidence/diversions.json \
                  node scripts/publish-ttc-phase.js
