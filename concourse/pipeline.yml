resources:
  - name: refresh
    type: time
    source:
      # The single update-sirento job runs the incident ETL plus a 90-second TTC
      # vehicle burst and typically takes 2-4 minutes. A 5-minute interval keeps
      # the timer above the worst-case job duration so builds do not queue.
      interval: 5m
  - name: repo
    type: git
    source:
      uri: ((repo_uri))
      branch: main
      private_key: ((repo_private_key))

  # Two scoped views of the same `data` branch, one per dataset. `paths` limits
  # which commits yield new versions from `check`, so an incident-only commit
  # does not re-trigger the TTC resource and vice versa. `sparse_paths` checks
  # out only the file each phase owns, so a phase can never stage the other
  # dataset. Both phases still push to the same branch; the `put` below uses
  # `rebase: true` for a safe fast-forward.
  - name: snapshots-incidents
    type: git
    source:
      uri: ((repo_uri))
      branch: data
      private_key: ((repo_private_key))
      paths:
        - data/current.json
      sparse_paths:
        - data/current.json
  - name: snapshots-ttc
    type: git
    source:
      uri: ((repo_uri))
      branch: data
      private_key: ((repo_private_key))
      paths:
        - data/ttc-diversions.json
      sparse_paths:
        - data/ttc-diversions.json

jobs:
  # Single writer for the `data` branch. The incident snapshot is committed first,
  # then the bounded TTC vehicle burst and geometry projection run as later steps.
  # A TTC failure cannot block or roll back the already-committed incident snapshot;
  # the next timer tick retries the TTC stage. Each phase commits only its own file
  # and the `put` uses `rebase: true`, so a cross-scheduler conflict preserves both
  # datasets without a lock.
  - name: update-sirento
    # One writer, one build at a time. max_in_flight serializes this job's own
    # builds so a slow run cannot overlap the next timer tick and race the push.
    max_in_flight: 1
    build_log_retention:
      builds: 50
    plan:
      - get: refresh
        trigger: true
      - get: snapshots-incidents
      - get: repo
      # Build the same pinned test image used by GitHub Actions. UNPACK_ROOTFS
      # exposes it as a task image for the following verification/update step.
      - task: build-test-image
        timeout: 5m
        privileged: true
        output_mapping:
          image: test-image
        config:
          platform: linux
          image_resource:
            type: registry-image
            source: { repository: concourse/oci-build-task }
          inputs:
            - name: repo
          outputs:
            - name: image
          caches:
            - path: cache
          params:
            CONTEXT: repo
            DOCKERFILE: repo/Dockerfile.test
            UNPACK_ROOTFS: "true"
          run:
            path: build
      - task: test-update-and-commit
        timeout: 10m
        image: test-image
        config:
          platform: linux
          inputs:
            - name: repo
            - name: snapshots-incidents
          outputs:
            - name: incident-repo
          run:
            path: sh
            args:
              - -ec
              - |
                BUILD_DIR=$PWD
                cp -a snapshots-incidents/. incident-repo/

                # Match the GitHub Actions test gate using the same image and
                # canonical offline-suite selector.
                cd /workspace
                TZ=America/Los_Angeles npm test
                npm run test:python
                npm run lint
                node --check app.js
                find src scripts -name "*.js" -exec node --check {} \;
                TZ=UTC NODE_V8_COVERAGE=/tmp/coverage npm run test:coverage

                # Shared freshness/skip policy and snapshot-only commit. The push
                # is done by the following `put`, so this script never pushes.
                cd "$BUILD_DIR"
                TFS_UPDATED_BY=concourse \
                  TFS_PREVIOUS="$BUILD_DIR/snapshots-incidents/data/current.json" \
                  TFS_OUTPUT="$BUILD_DIR/incident-repo/data/current.json" \
                  DATA_REPO_DIR="$BUILD_DIR/incident-repo" \
                  node /workspace/scripts/publish-incidents.js
      # PHASE 1: publish the incident snapshot before any TTC vehicle work. A slow
      # or failed TTC stage below cannot block or roll back this publication.
      - put: snapshots-incidents
        params:
          repository: incident-repo
          rebase: true
      # Bounded 90-second vehicle burst; never runs the heavy incident ETL.
      - task: observe-vehicles
        timeout: 6m
        file: repo/concourse/ttc-vehicles.yml
      # Project confirmed TTC geometry into a fresh checkout of the TTC-scoped
      # resource so only data/ttc-diversions.json is staged.
      - get: snapshots-ttc
      - task: commit-ttc-geometry
        config:
          platform: linux
          image_resource:
            type: registry-image
            source: { repository: node, tag: 24-bookworm }
          inputs:
            - name: repo
            - name: snapshots-ttc
            - name: ttc-vehicle-evidence
          outputs:
            - name: updated-repo
          run:
            path: sh
            args:
              - -ec
              - |
                # An output with the same name as an input replaces it, so seed the
                # output from the TTC-scoped checkout before adding TTC geometry.
                cp -a snapshots-ttc/. updated-repo/
                cd repo
                npm ci --omit=dev
                node scripts/publish-ttc-geometry.js ../ttc-vehicle-evidence/diversions.json ../updated-repo/data/ttc-diversions.json
                cd ../updated-repo
                git add -- data/ttc-diversions.json
                if ! git diff --cached --quiet; then
                  git -c user.name='SirenTO updater' -c user.email='sirento-updater@localhost' commit -m 'chore: refresh public TTC geometry'
                fi
      # PHASE 2: publish the TTC geometry. `rebase: true` starts from the latest
      # data branch and preserves the other dataset on a cross-scheduler conflict.
      # `no_get: true` avoids the implicit post-put get, which previously timed out
      # on this final step.
      - put: snapshots-ttc
        no_get: true
        params:
          repository: updated-repo
          rebase: true
