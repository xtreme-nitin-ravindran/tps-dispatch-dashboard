resources:
  - name: refresh
    type: time
    source:
      # The single update-feed job runs the incident ETL only. TTC geometry
      # (data/ttc-diversions.json) is owned by the continuous capture stack
      # (Story 64), not this bounded pipeline. max_in_flight prevents overlapping
      # publications if a run exceeds the timer interval.
      interval: 3m
  - name: repo
    type: git
    source:
      uri: ((repo_uri))
      branch: main
      private_key: ((repo_private_key))

jobs:
  # Single writer for the published incident data (data/current.json). The
  # incident snapshot is published to R2 directly. TTC geometry is owned by the
  # continuous capture stack, which writes data/ttc-diversions.json independently,
  # so the two datasets cannot conflict and no lock or serial group is needed.
  - name: update-feed
    # One writer, one build at a time. max_in_flight serializes this job's own
    # builds so a slow run cannot overlap the next timer tick.
    max_in_flight: 1
    build_log_retention:
      builds: 50
    plan:
      - get: refresh
        trigger: true
      - get: repo
      # main has already passed the protected promotion gate; this task only
      # installs runtime dependencies, updates the snapshot, and publishes it.
      - task: update-and-publish
        timeout: 10m
        config:
          platform: linux
          image_resource:
            type: registry-image
            source: { repository: node, tag: 26-bookworm-slim }
          inputs:
            - name: repo
          outputs:
            - name: incident-repo
          params:
            R2_ENDPOINT: ((r2_endpoint))
            R2_BUCKET: ((r2_bucket))
            R2_ACCESS_KEY_ID: ((r2_access_key_id))
            R2_SECRET_ACCESS_KEY: ((r2_secret_access_key))
          run:
            path: sh
            args:
              - -ec
              - |
                # Capture the declared Concourse output before changing directory.
                INCIDENT_OUTPUT="$PWD/incident-repo/data/current.json"
                cd repo
                npm ci --omit=dev

                # Seed the ETL history input from the published snapshot. A
                # missing object is not an error: the ETL starts fresh, exactly
                # as it did when the git checkout was empty.
                node scripts/r2-fetch.js data/current.json /tmp/history/current.json

                # Shared freshness/skip policy and R2 publication. The R2 sink
                # uploads directly, so there is no scheduler push step.
                TFS_UPDATED_BY=concourse \
                  TFS_PREVIOUS=/tmp/history/current.json \
                  TFS_OUTPUT="$INCIDENT_OUTPUT" \
                  node scripts/publish-incidents.js
      # TTC geometry is no longer published here: the continuous capture stack
      # (collector + processor, Story 64) owns data/ttc-diversions.json. Keep only
      # the incident ETL (data/current.json), which remains independent.
