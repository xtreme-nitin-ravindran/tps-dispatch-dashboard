# Separate bounded burst: build static index once; never runs the heavy incident ETL.
platform: linux
image_resource:
  type: registry-image
  source: { repository: node, tag: 24-bookworm-slim }
inputs:
  - name: repo
  # The preceding incident snapshot supplies official-advisory context. The TTC
  # website is never fetched again here; a missing input is a `not-loaded` contract.
  - name: incident-repo
outputs:
  - name: ttc-vehicle-evidence
caches:
  - path: ttc-vehicle-cache
params:
  TTC_STATIC_CACHE: ttc-vehicle-cache/surface.zip
  TTC_VEHICLE_STATE: ttc-vehicle-cache/vehicle-state.json
  TTC_DIVERSION_STATE: ttc-vehicle-cache/diversion-state.json
  TTC_DIVERSION_OUTPUT: ttc-vehicle-evidence/diversions.json
  TTC_VEHICLE_OUTPUT: ttc-vehicle-evidence/deviations.json
run:
  path: /bin/sh
  args:
    - -ec
    - |
      npm ci --prefix repo --omit=dev
      node repo/scripts/ttc-vehicles.js --polls 10 --interval-ms 30000 --advisory incident-repo/data/current.json
