# TTC capture service inventory.
#
# Two environments run the same Compose stack; only environment-specific
# variables (R2 bucket, ownership prefix, and the secrets file) differ, so a
# development writer can never contend with the production writer.
#
# `dev` is the development host; `production` is the always-on production host.
# Replace the placeholder `ansible_host` values with the real addresses and keep
# `ansible_user` matching the target account (default `sirento`).

all:
  children:
    dev:
      hosts:
        ttc-dev:
          ansible_host: 192.168.64.20
          ansible_user: sirento
    production:
      hosts:
        ttc-prod:
          ansible_host: 192.168.1.20
          ansible_user: sirento
