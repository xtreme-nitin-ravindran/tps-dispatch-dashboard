name: TTC vehicle evidence fallback
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ttc-vehicle-evidence
  cancel-in-progress: false
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/cache@v4
        with:
          path: .cache/ttc/surface.zip
          key: ttc-vehicle-static-v1-${{ github.run_id }}
          restore-keys: ttc-vehicle-static-v1-
      - run: npm ci --omit=dev
      # Fresh state per run: four polls supply actual timestamped evidence.
      - run: npm run update:ttc:vehicles -- --polls 4 --interval-ms 30000
      - uses: actions/upload-artifact@v4
        with:
          name: ttc-vehicle-deviations
          path: |
            .cache/ttc/deviations.json
            .cache/ttc/diversions.json
          retention-days: 1

      - uses: actions/checkout@v6
        with:
          ref: data
          path: public-data
      - name: Publish compact TTC geometry
        run: |
          node scripts/publish-ttc-geometry.js .cache/ttc/diversions.json public-data/data/ttc-diversions.json
          cd public-data
          git add -- data/ttc-diversions.json
          if ! git diff --cached --quiet; then
            git -c user.name='SirenTO updater' -c user.email='sirento-updater@localhost' commit -m 'chore: refresh public TTC geometry'
            git push origin HEAD:data
          fi
