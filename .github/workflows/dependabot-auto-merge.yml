name: Dependabot auto-merge

# Auto-merge minor and patch bumps for ecosystems that are safe to merge
# without human review. Major bumps always remain open for manual review, and
# the `docker` ecosystem never auto-merges version bumps because a Dockerfile
# `FROM node:<tag>` change must be paired with the Concourse `image_resource`
# tags in the same reviewed change (see test/concourse-node-image.test.js).
#
# `dev` is intentionally left unprotected (promotion to `main` still flows
# through a protected PR), so auto-merge here only fast-forwards reviewed,
# green, non-major bumps onto `dev`.

on:
  pull_request:
    branches: [dev]
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    runs-on: ubuntu-latest
    if: ${{ github.actor == 'dependabot[bot]' }}
    steps:
      - name: Fetch Dependabot PR metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2.3.0
      - name: Auto-merge non-major, non-docker bumps
        if: >-
          ${{ steps.metadata.outputs.update-type == 'version-update:semver-minor'
              || steps.metadata.outputs.update-type == 'version-update:semver-patch'
              || steps.metadata.outputs.update-type == 'security' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          # The docker ecosystem must stay manual: a Dockerfile FROM bump breaks
          # the Concourse Node image drift guard until a human edits the
          # Concourse tags in the same change.
          if [ "${{ steps.metadata.outputs.package-ecosystem }}" = "docker" ]; then
            echo "docker ecosystem bump; keeping PR manual"
            exit 0
          fi
          gh pr merge --auto --rebase "$PR_URL"
