name: Update SirenTO data
on:
  schedule:
    - cron: "2-59/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
# Single writer for the `data` branch. Incident ETL and the bounded TTC vehicle
# burst run as sequential steps in one job so there is exactly one push and no
# two writers can race a fast-forward push. A TTC failure fails the whole run,
# so the next scheduled run retries both.
concurrency:
  group: sirento-data-writer
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/checkout@v6
        with:
          ref: data
          path: snapshot-data
      - name: Read the current data-branch snapshot
        run: cp snapshot-data/data/current.json data/current.json
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Restore backend TTC static cache
        uses: actions/cache@v4
        with:
          path: .cache/ttc
          key: ttc-static-v1-${{ github.run_id }}
          restore-keys: ttc-static-v1-
      - run: npm ci --omit=dev
      - name: Update if the snapshot or incident feeds are stale
        id: snapshot
        run: node scripts/tfs-fallback.js
      - name: Observe TTC vehicle deviations
        # Fresh state per run: four polls supply actual timestamped evidence.
        run: npm run update:ttc:vehicles -- --polls 4 --interval-ms 30000
      - name: Project compact TTC geometry
        run: node scripts/publish-ttc-geometry.js .cache/ttc/diversions.json snapshot-data/data/ttc-diversions.json
      - name: Commit and push snapshot and TTC geometry
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          if [ "${{ steps.snapshot.outputs.updated }}" = "true" ]; then
            cp data/current.json snapshot-data/data/current.json
          fi
          cd snapshot-data
          # commit-tfs.js stages and commits data/current.json only, and requires a
          # clean index, so it must run before staging the TTC geometry.
          node ../scripts/commit-tfs.js
          git add -- data/ttc-diversions.json
          if git diff --cached --quiet; then
            echo "No TTC geometry changes to publish."
          else
            git -c user.name='SirenTO updater' -c user.email='sirento-updater@localhost' commit -m 'chore: refresh public TTC geometry'
          fi
          # Fast-forward only. A concurrent writer wins; the next run retries.
          git push origin HEAD:data
