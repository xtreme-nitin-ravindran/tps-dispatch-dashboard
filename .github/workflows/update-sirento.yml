name: Update SirenTO data
on:
  schedule:
    - cron: "2-59/5 * * * *"
  workflow_dispatch:
permissions:
  contents: read
# Single writer for the published incident data (data/current.json). TTC geometry
# (data/ttc-diversions.json) is owned by the continuous capture stack (Story 64),
# not this bounded scheduler; only the incident ETL runs here.
concurrency:
  group: sirento-data-writer
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npm ci --omit=dev
      - name: Publish incident snapshot
        # Shared freshness/skip policy and R2 publication. The R2 sink uploads
        # directly, so there is no scheduler push step. The ETL writes and
        # publishes data/current.json.
        env:
          TFS_UPDATED_BY: github-actions
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: node scripts/publish-incidents.js
