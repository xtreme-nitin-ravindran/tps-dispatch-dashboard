name: Update SirenTO incidents
on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tfs-snapshot-fallback
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/checkout@v6
        with:
          ref: data
          path: snapshot-data
      - name: Read the current data-branch snapshot
        run: cp snapshot-data/data/current.json data/current.json
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Update if the snapshot or incident feeds are stale
        id: snapshot
        run: node scripts/tfs-fallback.js
      - name: Commit and push snapshot
        if: steps.snapshot.outputs.updated == 'true'
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          cp data/current.json snapshot-data/data/current.json
          cd snapshot-data
          node ../scripts/commit-tfs.js
          # Fast-forward only. A concurrent writer wins; the next run retries.
          git push origin HEAD:data
