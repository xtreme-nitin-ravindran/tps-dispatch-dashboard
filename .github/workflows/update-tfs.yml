name: Update SirenTO incidents
on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: tfs-snapshot-fallback
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Update only if snapshot is at least 10 minutes old
        id: snapshot
        run: node scripts/tfs-fallback.js
      - name: Commit and push snapshot
        if: steps.snapshot.outputs.updated == 'true'
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          node scripts/commit-tfs.js
          # Never force or rebase generated data. Concurrent Concourse pushes
          # reject this push safely; the next run rechecks the newest snapshot.
          git push origin HEAD:main
      - name: Request GitHub Pages rebuild
        if: steps.snapshot.outputs.updated == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
