name: Tests

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: All tests (Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Keep generated snapshots out of code changes
        run: git diff --exit-code origin/main...HEAD -- data/current.json

      - name: Build test image
        id: build
        run: docker build -f Dockerfile.test -t toronto-dispatch-tests .

      - name: Run unit tests
        run: |
          docker run --rm -e TZ=UTC toronto-dispatch-tests
          docker run --rm -e TZ=America/Los_Angeles toronto-dispatch-tests

      - name: Run Python tests
        run: docker run --rm toronto-dispatch-tests npm run test:python

      - name: Run linters
        run: docker run --rm toronto-dispatch-tests npm run lint

      - name: Check browser JavaScript syntax
        run: |
          node --check app.js
          find src scripts -name "*.js" -exec node --check {} \;

      - name: Run combined suite with coverage
        shell: bash
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          docker run --rm -e NODE_V8_COVERAGE=/tmp/coverage toronto-dispatch-tests npm run test:coverage | tee coverage-report.txt
          python3 scripts/coverage-badges.py coverage-report.txt coverage-badges

      - name: Save coverage badges and report
        uses: actions/upload-artifact@v6
        with:
          name: coverage-badges
          if-no-files-found: error
          path: |
            coverage-badges/*.svg
            coverage-report.txt

  promote:
    name: Promote tested dev
    needs: tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: promote-dev
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Merge tested dev through a protected pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/promote-dev.js

  coverage:
    name: Publish coverage badges
    if: github.ref == 'refs/heads/dev'
    needs: tests
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: coverage-badges
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v7
        with:
          name: coverage-badges
          path: ${{ runner.temp }}/coverage-result
      - name: Publish generated badges on the coverage branch
        env:
          REPORT_DIR: ${{ runner.temp }}/coverage-result
        run: |
          # An older run must not overwrite coverage for a newer dev commit.
          if ! git diff --quiet "$GITHUB_SHA" origin/dev; then
            echo "Dev advanced; leaving badges for the newer run."
            exit 0
          fi
          if git show-ref --verify --quiet refs/remotes/origin/coverage; then
            git switch --track origin/coverage
          else
            git switch --orphan coverage
          fi
          cp "$REPORT_DIR"/coverage-badges/*.svg .
          cp "$REPORT_DIR"/coverage-report.txt .
          git add lines.svg branches.svg functions.svg coverage-report.txt
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Update measured coverage for $GITHUB_SHA"
          git push origin coverage
