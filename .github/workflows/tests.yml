name: Tests

on:
  push:
    branches: [dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: All tests (Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Build test image
        id: build
        run: docker build -f Dockerfile.test -t toronto-dispatch-tests .

      - name: Run unit tests
        run: |
          docker run --rm -e TZ=UTC toronto-dispatch-tests
          docker run --rm -e TZ=America/Los_Angeles toronto-dispatch-tests

      - name: Run official-source integration test
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: docker run --rm toronto-dispatch-tests npm run test:integration
